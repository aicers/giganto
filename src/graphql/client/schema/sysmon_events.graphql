query SysmonEvents(
  $filter: SysmonEventFilter!
  $after: String
  $before: String
  $first: Int
  $last: Int
) {
  sysmonEvents(
    filter: $filter
    after: $after
    before: $before
    first: $first
    last: $last
  ) {
    pageInfo {
      hasPreviousPage
      hasNextPage
      startCursor
      endCursor
    }
    edges {
      cursor
      node {
        __typename
        ... on ProcessCreateEvent {
          time
          agentName
          agentId
          processGuid
          processId
          image
          fileVersion
          description
          product
          company
          originalFileName
          commandLine
          currentDirectory
          user
          logonGuid
          logonId
          terminalSessionId
          integrityLevel
          hashes
          parentProcessGuid
          parentProcessId
          parentImage
          parentCommandLine
          parentUser
          endpoint {
            ...EndpointHeaderFields
          }
          logonIdFull
        }
        ... on FileCreationTimeChangedEvent {
          time
          agentName
          agentId
          processGuid
          processId
          image
          targetFilename
          creationUtcTime
          previousCreationUtcTime
          user
          endpoint {
            ...EndpointHeaderFields
          }
        }
        ... on NetworkConnectionEvent {
          time
          agentName
          agentId
          processGuid
          processId
          image
          user
          protocol
          initiated
          sourceIsIpv6
          sourceIp
          sourceHostname
          sourcePort
          sourcePortName
          destinationIsIpv6
          destinationIp
          destinationHostname
          destinationPort
          destinationPortName
          endpoint {
            ...EndpointHeaderFields
          }
        }
        ... on ProcessTerminatedEvent {
          time
          agentName
          agentId
          processGuid
          processId
          image
          user
          endpoint {
            ...EndpointHeaderFields
          }
        }
        ... on ImageLoadedEvent {
          time
          agentName
          agentId
          processGuid
          processId
          image
          imageLoaded
          fileVersion
          description
          product
          company
          originalFileName
          hashes
          signed
          signature
          signatureStatus
          user
          endpoint {
            ...EndpointHeaderFields
          }
        }
        ... on FileCreateEvent {
          time
          agentName
          agentId
          processGuid
          processId
          image
          targetFilename
          creationUtcTime
          user
          endpoint {
            ...EndpointHeaderFields
          }
        }
        ... on RegistryValueSetEvent {
          time
          agentName
          agentId
          eventType
          processGuid
          processId
          image
          targetObject
          details
          user
          endpoint {
            ...EndpointHeaderFields
          }
        }
        ... on RegistryKeyValueRenameEvent {
          time
          agentName
          agentId
          eventType
          processGuid
          processId
          image
          targetObject
          newName
          user
          endpoint {
            ...EndpointHeaderFields
          }
        }
        ... on FileCreateStreamHashEvent {
          time
          agentName
          agentId
          processGuid
          processId
          image
          targetFilename
          creationUtcTime
          hash
          contents
          user
          endpoint {
            ...EndpointHeaderFields
          }
        }
        ... on PipeEventEvent {
          time
          agentName
          agentId
          eventType
          processGuid
          processId
          pipeName
          image
          user
          endpoint {
            ...EndpointHeaderFields
          }
        }
        ... on DnsEventEvent {
          time
          agentName
          agentId
          processGuid
          processId
          queryName
          queryStatus
          queryResults
          image
          user
          endpoint {
            ...EndpointHeaderFields
          }
        }
        ... on FileDeleteEvent {
          time
          agentName
          agentId
          processGuid
          processId
          user
          image
          targetFilename
          hashes
          isExecutable
          archived
          endpoint {
            ...EndpointHeaderFields
          }
        }
        ... on ProcessTamperingEvent {
          time
          agentName
          agentId
          processGuid
          processId
          image
          tamperType
          user
          endpoint {
            ...EndpointHeaderFields
          }
        }
        ... on FileDeleteDetectedEvent {
          time
          agentName
          agentId
          processGuid
          processId
          user
          image
          targetFilename
          hashes
          isExecutable
          endpoint {
            ...EndpointHeaderFields
          }
        }
        ... on DriverLoadEvent {
          time
          agentName
          agentId
          imageLoaded
          hashes
          signed
          signature
          signatureStatus
          endpoint {
            ...EndpointHeaderFields
          }
        }
        ... on CreateRemoteThreadEvent {
          time
          agentName
          agentId
          sourceProcessGuid
          sourceProcessId
          sourceImage
          targetProcessGuid
          targetProcessId
          targetImage
          newThreadId
          startAddress
          startModule
          startFunction
          sourceUser
          targetUser
          endpoint {
            ...EndpointHeaderFields
          }
        }
        ... on RawAccessReadEvent {
          time
          agentName
          agentId
          processGuid
          processId
          image
          device
          user
          endpoint {
            ...EndpointHeaderFields
          }
        }
        ... on ProcessAccessEvent {
          time
          agentName
          agentId
          sourceProcessGuid
          sourceProcessId
          sourceThreadId
          sourceImage
          targetProcessGuid
          targetProcessId
          targetImage
          grantedAccess
          callTrace
          sourceUser
          targetUser
          endpoint {
            ...EndpointHeaderFields
          }
        }
        ... on RegistryObjectAddDelEvent {
          time
          agentName
          agentId
          eventType
          processGuid
          processId
          image
          targetObject
          user
          endpoint {
            ...EndpointHeaderFields
          }
        }
      }
    }
  }
}

fragment EndpointHeaderFields on EndpointHeader {
  endpointId
  stream
  seq
  eventTime
  collectedAt
  clockOffset {
    offsetMs
    uncertaintyMs
    measuredAt
  }
  hostname
  ips
  defaultRouteIp
  netStateSource
  osFamily
  osVersion
  collectionMode
  processKey
  schema
}
