query EndpointWindowsEventLogEvents(
  $filter: EndpointLogFilter!
  $after: String
  $before: String
  $first: Int
  $last: Int
) {
  endpointWindowsEventLogEvents(
    filter: $filter
    after: $after
    before: $before
    first: $first
    last: $last
  ) {
    pageInfo {
      hasPreviousPage
      hasNextPage
      startCursor
      endCursor
    }
    edges {
      cursor
      node {
        time
        channel
        provider
        eventId
        version
        level
        task
        opcode
        keywords
        recordId
        computer
        userSid
        eventData {
          name
          value
        }
        userDataXml
        endpoint {
          ...EndpointHeaderFields
        }
      }
    }
  }
}

fragment EndpointHeaderFields on EndpointHeader {
  endpointId
  stream
  seq
  eventTime
  collectedAt
  clockOffset {
    offsetMs
    uncertaintyMs
    measuredAt
  }
  hostname
  ips
  defaultRouteIp
  netStateSource
  osFamily
  osVersion
  collectionMode
  processKey
  schema
}
