[package]
name = "giganto"
version = "0.39.0"
edition = "2024"
publish = false
default-run = "giganto"

[lib]
name = "giganto_proc_macro"
proc-macro = true

[[bin]]
name = "giganto"

[[bin]]
name = "gen_schema"
path = "src/gen_schema.rs"

[dependencies]
anyhow = "1"
async-graphql = { version = "7", features = ["string_number"] }
base64 = "0.23"
bincode = "1"
clap = { version = "4", features = ["derive"] }
config = { version = "0.15", features = ["toml"], default-features = false }
darling = "0.24"
futures-util = "0.3"
giganto-client = { git = "https://github.com/aicers/giganto-client.git", tag = "0.32.0" }
graphql_client = "0.16"
humantime-serde = "1"
libc = "0.2"
nix = { version = "0.32", features = ["fs", "resource"] }
num_enum = "0.7"
num-traits = "0.2"
pcap = "2"
proc-macro2 = "1"
quinn = { version = "0.11", default-features = false, features = [
    "log",
    "platform-verifier",
    "runtime-tokio",
    "rustls-aws-lc-rs",
    "bloom",
] }
quote = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-webpki-roots-no-provider",
    "json",
] }
rocksdb = "0.25"
rustls = { version = "0.23.46", default-features = false, features = [
    "aws_lc_rs",
    "prefer-post-quantum",
    "std",
] }
semver = "1"
# The endpoint entry's wire protocol, TLS configuration and connection state
# machine, shared with Clumit Endpoint and REview.
senta-protocol = { git = "https://github.com/aicers/senta-protocol.git", tag = "0.1.0", features = [
    "auth",
    "telemetry",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = "3"
tempfile = "3"
tokio = { version = "1", features = [
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tokio-rustls = "0.26"
thiserror = "2"
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The endpoint entry's `entry_id`, the type senta-protocol carries it as.
uuid = "1"
# `verify-aws` checks which CA certificate signed the node certificate when
# the endpoint chain is chosen, over the aws-lc-rs rustls already uses.
x509-parser = { version = "0.18", features = ["verify-aws"] }
poem = { version = "3", features = ["rustls"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-graphql-poem = "7"
jiff = { version = "1", features = ["serde"] }

[dev-dependencies]
mockito = "1"
pretty_assertions = "1"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
regex = "1"
# `test-util` gives tests senta-protocol's deterministic test keys.
senta-protocol = { git = "https://github.com/aicers/senta-protocol.git", tag = "0.1.0", features = [
    "auth",
    "telemetry",
    "test-util",
] }
serial_test = "4"
# `test-util` gives tests the paused clock (`#[tokio::test(start_paused =
# true)]`), so a timing-dependent test advances virtual time instead of
# sleeping. It is a dev-dependency feature, so it is not enabled in the binary.
tokio = { version = "1", features = ["test-util"] }
url = "2"

[features]
default = ["benchmark", "cluster"]
benchmark = []
cluster = []
storage_diagnostics = []

[target.'cfg(not(unix))'.dependencies]
ctrlc = { version = "3", features = ["termination"] }

[lints.clippy]
pedantic = "warn"
unwrap_used = "warn"
