[package]
name = "giganto"
version = "0.28.0"
edition = "2024"
default-run = "giganto"

[lib]
name = "giganto_proc_macro"
proc-macro = true

[[bin]]
name = "giganto"

[[bin]]
name = "gen_schema"
path = "src/gen_schema.rs"

[dependencies]
anyhow = "1"
async-graphql = { version = "7", features = ["string_number"] }
base64 = "0.23"
bincode = "1"
clap = { version = "4", features = ["derive"] }
config = { version = "0.15", features = ["toml"], default-features = false }
darling = "0.24"
futures-util = "0.3"
giganto-client = { git = "https://github.com/aicers/giganto-client.git", rev = "0.28.0" }
graphql_client = "0.16"
humantime-serde = "1"
libc = "0.2"
num_enum = "0.7"
num-traits = "0.2"
pcap = "2"
proc-macro2 = "1"
quinn = { version = "0.11", features = ["ring"] }
quote = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
rocksdb = "0.25"
roxy = { git = "https://github.com/aicers/roxy.git", tag = "0.6.0" }
rustls = { version = "0.23", default-features = false, features = [
    "aws_lc_rs",
    "std",
] }
rustls-pemfile = "2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = "3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal"] }
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x509-parser = "0.18"
poem = { version = "3", features = ["rustls"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-graphql-poem = "7"
jiff = { version = "0.2", features = ["serde"] }

[dev-dependencies]
mockito = "1"
pretty_assertions = "1"
rcgen = "0.14"
regex = "1"
serial_test = "4"
# `test-util` gives tests the paused clock (`#[tokio::test(start_paused =
# true)]`), so a timing-dependent test advances virtual time instead of
# sleeping. It is a dev-dependency feature, so it is not enabled in the binary.
tokio = { version = "1", features = ["test-util"] }
tokio-rustls = "0.26"
url = "2"

[features]
default = ["benchmark", "cluster"]
benchmark = []
bootroot = []
cluster = []
storage_diagnostics = []

[target.'cfg(not(unix))'.dependencies]
ctrlc = { version = "3", features = ["termination"] }

[lints.clippy]
pedantic = "warn"
unwrap_used = "warn"
