version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    # `chore(deps): ...`, the Conventional title of a dependency update.
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      - dependency-name: "giganto-client"
    cooldown:
      default-days: 3
      exclude:
        - "senta-protocol"
