name: Upload Release Binary

# Builds giganto at a release tag and uploads the binary to that tag's
# GitHub Release, which release-plz has already created with the version's
# changelog section as its notes. `release-plz.yml` calls it after each
# release; `workflow_dispatch` uploads again by hand, replacing the asset
# that is there. It never creates a Release.
#
# In a called workflow, `github.event`, `github.event_name` and
# `github.ref_name` are the caller's, so the tag is read only from the
# inputs: `tag` under workflow_call, `tag_name` under workflow_dispatch.
#
# No `concurrency`: under workflow_call this runs in the caller's `release`
# group, and a called workflow in its caller's group is cancelled as a
# deadlock.

on:
  workflow_call:
    inputs:
      tag:
        description: Version tag (X.Y.Z) whose GitHub Release receives the binary
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "tag name"
        required: true
        default: "0.1.0"

permissions: {}

env:
  BINARY: giganto
  TAG: ${{ inputs.tag || inputs.tag_name }}

jobs:
  build-upload:
    runs-on: ubuntu-latest
    permissions:
      # Uploads the asset; reading the Release and checking out this public
      # repository need no more.
      contents: write
    steps:
      - name: Check the tag
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The tag must be a version such as 1.2.3, got $(jq -R . <<< "$TAG")."
            exit 1
          fi
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          # The job holds `contents: write`, and `cargo build` runs every
          # dependency's build script: keep the token out of `.git/config`.
          persist-credentials: false
      - name: Find the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          err="$RUNNER_TEMP/release-lookup.err"
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id > /dev/null 2> "$err"; then
            cat "$err" >&2
            if grep -q 'HTTP 404' "$err"; then
              echo "::error::No GitHub Release exists for tag $TAG. release-plz creates it; this workflow only uploads to it."
            else
              echo "::error::Could not look up the GitHub Release for tag $TAG."
            fi
            exit 1
          fi
      - name: Update to the Latest Version of Rust
        run: rustup update
      # `-o Acquire::Retries=3` and the step timeout: on 2026-11-11 hosted
      # runners could not resolve the Ubuntu archive for hours, and apt
      # steps failed or stalled. The image sets `Acquire::Retries "1"`; the
      # timeout is three times the step's longest recent success, rounded
      # up to 5 minutes, minimum 10.
      - name: Install the Tools
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install libpcap-dev
      - name: Build Binaries
        run: |
          RELEASE_TMP_DIR="$RUNNER_TEMP/giganto-release"
          mkdir -p "$RELEASE_TMP_DIR"

          cargo build --release
          cp "target/release/$BINARY" "$RELEASE_TMP_DIR/$BINARY"
      - name: Upload Assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_TMP_DIR="$RUNNER_TEMP/giganto-release"

          # `--clobber` replaces an asset of the same name, so uploading
          # again by hand overwrites the binary already there. A file with
          # no extension is uploaded as application/octet-stream.
          gh release upload "$TAG" "$RELEASE_TMP_DIR/$BINARY" \
            --repo "$GITHUB_REPOSITORY" --clobber
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fqx "$BINARY"; then
            echo "::error::The Release for tag $TAG has no asset named $BINARY after the upload."
            exit 1
          fi
