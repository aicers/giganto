# CHANGE FILTER: `changes` classifies the run's diff, and `check`, `schema`,
# `test` and `coverage` gate on its `docs_only` output, so a change that only
# touches inert documentation does not build the crate in nine jobs.
# `markdown` and `lint` are deliberately ungated: `markdown` runs markdownlint
# and the shared instruction-block drift check, and `lint` the docs build,
# which are exactly the checks a docs-only change needs.
#
# THE GATE IS FAIL-CLOSED. Each gated job's `if:` runs the job whenever the
# filter did not positively report docs-only, including when the filter itself
# failed. Without `!cancelled()` a failing `changes` would skip its dependants
# instead, and GitHub counts a skipped required status check as a pass.
#
# `CI Gate` IS THE REQUIRED STATUS CHECK, not the individual jobs. A matrix job
# skipped at the job level is never expanded, so a docs-only run reports
# `test` rather than `test (ubuntu-latest, default)`, and a protection rule
# naming the expanded contexts would wait forever for statuses that never
# come. `CI Gate` always reports, under one stable name.

name: CI

# TRIGGERS: `push` is scoped to `main`. Without a branch filter it also matches
# pushes to pull-request branches, which already match `pull_request`, so every
# job ran twice per commit, on two separate workflow runs. Naming `branches:`
# also stops tag pushes from matching. `pull_request` checks out the branch
# already merged into its base, so merge coverage is not what is being dropped
# here — the one thing lost is CI on a branch with no pull request open, and
# `workflow_dispatch` replaces it (`gh workflow run ci.yml --ref <branch>`).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && '-dispatch' || (github.run_attempt != '1' && format('-rerun-{0}', github.run_id) || '') }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Change Filter
    runs-on: ubuntu-latest
    # Scoped to this job alone. The filter only reads the checked-out
    # history, so `contents: read` is all it needs.
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs-only }}
    steps:
      # The full history, because the action diffs locally and does not
      # fetch: a pull request against its merge-base with the base branch,
      # a push to `main` against `github.event.before`, and a dispatched
      # branch against its merge-base with `main`.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # `docs-paths` is the documentation allowlist that AGENTS.md also uses
      # to define a documentation-only change, on top of the action's
      # built-in list (`*.md`, `LICENSE`, `.agent-instructions.toml`,
      # `.markdownlint*`). `.agent-instructions.toml` is on it because the
      # pin is read only by the drift check in the ungated `markdown` job.
      # `not-docs-paths` names every path a build or a test reads, and wins
      # over the allowlist.
      #
      # Docs-only requires every changed file to be on the allowlist and
      # none on `not-docs-paths`. A path on neither list therefore leaves
      # the change not docs-only, even next to documentation, and runs the
      # full suite. Anything the action cannot establish runs it as well.
      - id: scope
        uses: aicers/agent-instructions/change-scope@main
        with:
          docs-paths: |
            docs/**
            docs-internal/**
            **/*.md
            mkdocs.yml
            .markdownlint*
            .agent-instructions.toml
            LICENSE
          not-docs-paths: |
            src/**
            tests/**
            build.rs
            Cargo.toml
            Cargo.lock
            clippy.toml
            scripts/**
            .github/workflows/**
            .github/cache-cargo/**

  check:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    strategy:
      matrix:
        include:
          - feature_set: default
            cargo_flags: ""
          - feature_set: standalone
            cargo_flags: --no-default-features --features benchmark
          - feature_set: all-features
            cargo_flags: --all-features
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/checkout@v5
      - uses: ./.github/cache-cargo
      - name: Clippy (${{ matrix.feature_set }})
        run: cargo clippy ${{ matrix.cargo_flags }} --tests -- -D warnings
      - name: Check (${{ matrix.feature_set }})
        run: cargo check ${{ matrix.cargo_flags }} --tests
      # Cargo.lock is feature-independent, but its drift only surfaces after a
      # cargo invocation has re-resolved it, so this runs on one matrix entry
      # rather than in the feature-independent `lint` job below.
      - name: Detect Cargo.lock changes
        if: matrix.feature_set == 'default'
        run: git diff-index --quiet HEAD --
  lint:
    runs-on: ubuntu-latest
    # Read-only. Nothing here writes: `scripts/fetch-theme.sh` reads the
    # public aicers/docs-theme.
    permissions:
      contents: read
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/checkout@v5
      - uses: biomejs/setup-biome@v2
        with:
          version: latest
      - uses: ./.github/cache-cargo
      - name: Check formatting
        run: cargo fmt -- --check --config group_imports=StdExternalCrate
      - name: Biome check
        run: biome ci
      - name: Fetch docs theme
        run: scripts/fetch-theme.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up MkDocs
        run: python3 -m pip install --upgrade pip mkdocs-material mkdocs-static-i18n
      - name: Build Docs
        run: mkdocs build --strict

  # Ungated, deliberately: a docs-only change skips every gated job, so this
  # is the Markdown check it gets.
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    # Read-only, as in the other consumers of aicers/agent-instructions.
    # Nothing here writes: the lint reads the checkout, and the drift check
    # reads the pin and the upstream release.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        id: checkout
      # No `globs` input. The `globs` of the root `.markdownlint-cli2.yaml`
      # are the one place that decides which files are linted, here and in a
      # local `markdownlint-cli2` alike; they are recursive, so the
      # documents under `docs/` are linted. The rules stay in
      # `.markdownlint.yaml`. The action's default `*.{md,markdown}` is only
      # added to the config's globs and changes nothing.
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v25
      # Fails when this repository's copy of the shared instruction blocks
      # stops matching the release `.agent-instructions.toml` pins --
      # because a generated region of AGENTS.md was edited here, or because
      # an update pull request was never merged.
      #
      # In `markdown` because that is the job that concerns itself with
      # Markdown, and because it must not inherit the docs-only gate: a pull
      # request that edits only a generated region of AGENTS.md is
      # docs-only.
      #
      # `@main`: the scripts are mechanism and come from wherever this
      # reference points, while the blocks are content and come from the
      # pin. No `with:` block, because the release to compare against and
      # the blocks to compare are both read from that one file.
      #
      # Guarded rather than left to the default `success()`, which would
      # skip it whenever a step above failed. The checks are independent --
      # a drifted block is drift whether or not the Markdown lint also
      # failed. `!cancelled()` rather than `always()`, because a cancelled
      # run should stop. The `checkout` clause keeps a failed checkout from
      # being reported as drift: the action fails outright when it cannot
      # read the pin file, and in an empty workspace that message names the
      # pin for a problem that is not the pin's.
      - name: Check shared instruction-block drift
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: aicers/agent-instructions/check-drift@main

  schema:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: actions/checkout@v5
      - uses: ./.github/cache-cargo
      # `-o Acquire::Retries=3` and the step timeout: on 2026-11-11 hosted
      # runners could not resolve the Ubuntu archive for hours, and apt
      # steps failed or stalled. The image sets `Acquire::Retries "1"`; the
      # timeout is three times the step's longest recent success, rounded
      # up to 5 minutes, minimum 10.
      - name: Install libcap on Ubuntu
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 install libpcap-dev libpcap0.8
      - name: Schema snapshot check
        run: cargo test --bin gen_schema graphql::tests::schema_should_be_up_to_date
          --no-default-features -- --ignored
  test:
    runs-on: ${{ matrix.os }}
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macOS-latest ]
        feature_set: [ default, all-features ]
        include:
          - feature_set: default
            cargo_flags: ""
          - feature_set: all-features
            cargo_flags: --all-features
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: actions/checkout@v5
      - uses: ./.github/cache-cargo
      # `-o Acquire::Retries=3` and the step timeout: on 2026-11-11 hosted
      # runners could not resolve the Ubuntu archive for hours, and apt
      # steps failed or stalled. The image sets `Acquire::Retries "1"`; the
      # timeout is three times the step's longest recent success, rounded
      # up to 5 minutes, minimum 10.
      - name: Install libcap on Ubuntu
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 install libpcap-dev libpcap0.8
      - name: Build (${{ matrix.feature_set }})
        run: cargo build ${{ matrix.cargo_flags }} --verbose
      - name: Run tests (${{ matrix.feature_set }})
        run: |
          soft_before=$(ulimit -Sn)
          hard_before=$(ulimit -Hn)
          echo "Open-file limits before: soft=$soft_before hard=$hard_before"
          if [ "$soft_before" != unlimited ]; then
            target=8096
            if [ "$hard_before" != unlimited ] && [ "$hard_before" -lt "$target" ]; then
              target=$hard_before
            fi
            if [ "$soft_before" -lt "$target" ]; then
              ulimit -Sn "$target"
            fi
          fi
          echo "Open-file limits after: soft=$(ulimit -Sn) hard=$(ulimit -Hn)"
          cargo test ${{ matrix.cargo_flags }} --verbose

  coverage:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    strategy:
      matrix:
        feature_set: [ default ]
        include:
          - feature_set: default
            cargo_flags: ""
    steps:
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: actions/checkout@v5
      - uses: ./.github/cache-cargo
      # `-o Acquire::Retries=3` and the step timeout: on 2026-11-11 hosted
      # runners could not resolve the Ubuntu archive for hours, and apt
      # steps failed or stalled. The image sets `Acquire::Retries "1"`; the
      # timeout is three times the step's longest recent success, rounded
      # up to 5 minutes, minimum 10.
      - name: Install libcap on Ubuntu
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 install libpcap-dev libpcap0.8
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate code coverage (${{ matrix.feature_set }})
        run: |
          soft_before=$(ulimit -Sn)
          hard_before=$(ulimit -Hn)
          echo "Open-file limits before: soft=$soft_before hard=$hard_before"
          if [ "$soft_before" != unlimited ]; then
            target=8096
            if [ "$hard_before" != unlimited ] && [ "$hard_before" -lt "$target" ]; then
              target=$hard_before
            fi
            if [ "$soft_before" -lt "$target" ]; then
              ulimit -Sn "$target"
            fi
          fi
          echo "Open-file limits after: soft=$(ulimit -Sn) hard=$(ulimit -Hn)"
          cargo llvm-cov ${{ matrix.cargo_flags }} --workspace --lcov --output-path lcov-${{ matrix.feature_set }}.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov-${{ matrix.feature_set }}.info
          fail_ci_if_error: true

  # `always()`, deliberately, and not `!cancelled()`: a cancelled run would
  # otherwise skip this job, and GitHub counts a skipped required check as a
  # pass. Running through cancellation lets the assertions below see the
  # cancelled results and report red. `markdown` and `lint` are among the
  # needs although they are not gated, so that the gate covers them too.
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [changes, markdown, lint, check, schema, test, coverage]
    if: ${{ always() }}
    steps:
      # A filter that errored is a defect, not a tolerable outcome. The gated
      # jobs did still run (their `if:` fails closed), but the breakage has to
      # be visible rather than absorbed.
      - name: Assert the change filter succeeded
        if: ${{ needs.changes.result != 'success' }}
        run: |
          echo "Change Filter: ${{ needs.changes.result }}" >&2
          exit 1

      # `skipped` is a pass here, and only here: it is what a gated job
      # reports on a docs-only change. `cancelled` is not.
      - name: Assert every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "${RESULTS}"
          bad="$(printf '%s' "${RESULTS}" \
            | jq -r 'to_entries[]
                     | select(.value.result != "success" and .value.result != "skipped")
                     | "  \(.key): \(.value.result)"')"
          if [ -n "${bad}" ]; then
            echo "Not green:" >&2
            echo "${bad}" >&2
            exit 1
          fi
